name: Build Himalaya Campfire VST3

on:
  push:
    branches: ["**"]
    paths:
      - "himalaya-campfire-vst/**"
      - ".github/workflows/build-vst.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WebView2 NuGet package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\nuget-packages" | Out-Null
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:GITHUB_WORKSPACE\nuget-packages"

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -S himalaya-campfire-vst
          -G "Visual Studio 17 2022" -A x64
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE\nuget-packages"

      - name: Build
        run: cmake --build build --config Release --target HimalayaCampfire_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: HimalayaCampfire-Windows-VST3
          path: build/HimalayaCampfire_artefacts/Release/VST3/

  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -S himalaya-campfire-vst
          -G Xcode
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target HimalayaCampfire_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: HimalayaCampfire-macOS-VST3
          path: build/HimalayaCampfire_artefacts/Release/VST3/
