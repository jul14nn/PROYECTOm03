<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Angel Whisper</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="knob-panel">
    <div class="knob-plate">
      <div id="knob" class="knob" tabindex="0" role="slider" aria-label="Intensidad del susurro"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
        <div class="knob-pointer"></div>
      </div>
      <div class="knob-label">
        <span>INTENSIDAD</span>
      </div>
    </div>
  </div>

  <script src="noise.js"></script>
  <script src="scene.js"></script>
  <script src="cherub.js"></script>
  <script src="knob.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
