<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Angel Whisper</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="panel">
    <header class="panel-head">
      <h1>ANGEL WHISPER</h1>
      <button id="settings-toggle" title="Ajustes">⚙</button>
    </header>

    <div id="settings" hidden>
      <label>Python
        <input id="python-path" type="text" spellcheck="false"
               placeholder="/usr/bin/python3" />
      </label>
      <label>Carpeta midi-audio-extractor
        <input id="extractor-path" type="text" spellcheck="false"
               placeholder="…/PROYECTOm03/midi-audio-extractor" />
      </label>
      <label>Carpeta de salida
        <input id="output-path" type="text" spellcheck="false" />
      </label>
    </div>

    <div class="field">
      <label for="instrument">Instrumento</label>
      <select id="instrument">
        <option value="piano">Piano</option>
        <option value="voz">Voz</option>
        <option value="bajo">Bajo</option>
        <option value="guitarra">Guitarra</option>
        <option value="bateria">Batería</option>
      </select>
    </div>

    <div class="field">
      <label for="seconds-ago">Capturar lo de hace</label>
      <div class="row">
        <input id="seconds-ago" type="number" min="0" max="30" step="0.5" value="0.5" />
        <span class="unit">segundos</span>
      </div>
    </div>

    <label class="check">
      <input id="separate" type="checkbox" />
      <span>Separar el instrumento de la mezcla</span>
    </label>
    <p id="separate-note" class="hint">
      El canal ya trae el instrumento aislado: extracción en segundos.
    </p>

    <button id="capture-btn">EXTRAER</button>

    <p id="buffer-info" class="hint"></p>
    <p id="status-text" class="status-text"></p>

    <div id="result" hidden>
      <div id="result-files"></div>
      <div id="result-notes"></div>
      <p id="result-warning" class="hint warn" hidden></p>
    </div>

    <div class="knob-plate">
      <div id="knob" class="knob" tabindex="0" role="slider" aria-label="Intensidad del susurro"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
        <div class="knob-pointer"></div>
      </div>
      <div class="knob-label"><span>INTENSIDAD</span></div>
    </div>
  </div>

  <script src="noise.js"></script>
  <script src="scene.js"></script>
  <script src="cherub.js"></script>
  <script src="knob.js"></script>
  <script src="extractor.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
